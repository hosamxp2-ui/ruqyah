<title>الرقية الشرعية</title>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--tx:#1f2a24;--ac:#1e6b52;--mu:#7a7468;--bd:#e4dccb;--fs:24px;--ff:serif}
[data-th=sepia]{--bg:#efe2c6;--card:#f7ecd3;--tx:#3b2e1a;--ac:#8a5a1b;--mu:#7d6a4c;--bd:#dccaa0}
[data-th=dark]{--bg:#101614;--card:#18211e;--tx:#e8e6df;--ac:#5fc4a0;--mu:#97a39d;--bd:#26332e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{flex:none;padding:env(safe-area-inset-top) 12px 0;border-bottom:1px solid var(--bd)}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 4px}
h1{font-size:18px;margin:0;color:var(--ac)}
.ic{font-size:22px;padding:4px 10px;border-radius:10px;background:var(--card);border:1px solid var(--bd)}
#tabs,#tabs2{display:flex;gap:8px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}#tabs2 .tab{font-size:13px;padding:5px 12px}
.tab{white-space:nowrap;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--bd);font-size:14px}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;flex-direction:column;min-height:0;padding:10px 12px;max-width:100vw}
.in{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
.tx{font-family:var(--ff);font-size:var(--fs);line-height:2.1;margin:auto 0;text-align:center}
.emp{font-family:system-ui;font-size:16px;color:var(--mu)}
details{margin-top:10px;color:var(--mu);font-size:14px;line-height:1.8}summary{cursor:pointer}
.bar{flex:none;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.bar button{min-height:56px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none}
.bar small{font-size:11px;color:var(--mu)}
.bar .cb{background:var(--ac);color:#fff;border-color:var(--ac)}.cb small{color:#ffffffcc}
.bar.done .cb{opacity:.65}.fv.on{color:#d4a017}
footer{flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 14px calc(6px + env(safe-area-inset-bottom))}
.nv{font-size:26px;padding:2px 24px;border-radius:12px;background:var(--card);border:1px solid var(--bd)}
#ix{color:var(--mu);font-size:14px}
@media (orientation:landscape) and (max-height:520px){h1{display:none}.top{padding:2px 4px}.slide{flex-direction:row;gap:10px}.bar{width:250px;grid-template-columns:1fr 1fr;margin-top:0;align-content:center}.bar .cb{grid-column:1/-1}}
#sh{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:9}#sh[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:88dvh;overflow-y:auto;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{font-size:15px;margin:14px 0 8px;color:var(--mu)}.sheet h2:first-child{margin-top:0}
.opts{display:flex;gap:8px;flex-wrap:wrap}.opts button{flex:1 1 28%;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--bd)}
.opts button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#o-ff{flex-direction:column}#o-ff button{font-size:20px}
input[type=range]{width:100%;accent-color:var(--ac)}.pv{font-family:var(--ff);font-size:var(--fs);text-align:center;margin:6px 0}
.bar .cb{grid-column:span 2}.bar .src{grid-column:1/-1;min-height:44px;flex-direction:row;justify-content:space-between;padding:0 14px;font-size:14px}.bar .src b{color:var(--ac);font-weight:600}
#mw{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bg);border-top:2px solid var(--ac);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px #0004;max-width:720px;margin:0 auto;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#mw[hidden]{display:none}#mw[data-z=min]{height:52px}#mw[data-z=mid]{height:46dvh}#mw[data-z=max]{height:90dvh}#mw[data-z=min] .mb{display:none}
.mh{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;flex:none}.mh button{font-size:20px;padding:4px 10px}
.mb{flex:1;overflow-y:auto;padding:0 14px 14px;line-height:1.9;font-size:15px}.mb h3{font-size:13px;color:var(--mu);margin:12px 0 4px}
.mb a{display:block;margin:6px 0;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--ac);text-decoration:none}
.mb textarea{width:100%;min-height:70px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;padding:8px}
#ts{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 18px;border-radius:20px;z-index:12;font-size:14px}#ts[hidden]{display:none}
</style></head>
<body>
<header><div class="top"><h1>الرقية الشرعية</h1><button class="ic" id="gear" aria-label="الإعدادات">⚙</button></div><nav id="tabs"></nav><nav id="tabs2"></nav></header>
<main id="pg" class="pager"></main>
<footer><button class="nv" id="pv" aria-label="السابق">›</button><span id="ix"></span><button class="nv" id="nx" aria-label="التالي">‹</button></footer>
<div id="mw" data-z="mid" hidden><div class="mh"><b>المصدر</b><span><button data-w="min" aria-label="طي">▾</button><button data-w="max" aria-label="تكبير">⤢</button><button data-w="x" aria-label="إغلاق">✕</button></span></div><div class="mb" id="mb"></div></div>
<div id="ts" hidden></div>
<div id="sh" hidden><div class="sheet">

<h2>الانتقال التلقائي عند اكتمال العدد</h2><div class="opts" id="o-au"></div>
<h2>إبقاء الشاشة مضاءة</h2><div class="opts" id="o-wk"></div>
<h2>العمل دون إنترنت</h2><div id="off" style="font-size:14px;line-height:1.8"></div>

</div></div>
<script>
const D=[
{t:"الاستهلال",i:[
{x:"أَعُوذُ بِاللهِ السَّمِيعِ الْعَلِيمِ مِنَ الشَّيْطَانِ الرَّجِيمِ ﷽"},
{x:"﴿الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ۝٢﴾",r:"الفاتحة: ٢"},
{x:"﴿وَلِلَّهِ الأَسْمَاءُ الْحُسْنَى فَادْعُوهُ بِهَا وَذَرُوا الَّذِينَ يُلْحِدُونَ فِي أَسْمَائِهِ سَيُجْزَوْنَ مَا كَانُوا يَعْمَلُونَ ۝١٨٠﴾",r:"الأعراف: ١٨٠"},
{x:"﴿الْحَمْدُ لِلَّهِ الَّذِي لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الأَرْضِ وَلَهُ الْحَمْدُ فِي الآخِرَةِ وَهُوَ الْحَكِيمُ الْخَبِيرُ ۝١﴾",r:"سبأ: ١"},
{x:"﴿هُوَ الْحَيُّ لاَ إِلَهَ إِلاَّ هُوَ فَادْعُوهُ مُخْلِصِينَ لَهُ الدِّينَ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ۝٦٥﴾",r:"غافر: ٦٥"}]},
{t:"الرقية من القرآن",i:[
{x:"﴿بِسْمِ اللَّهِ الرَّحْمَانِ الرَّحِيمِ ۝١ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ۝٢ الرَّحْمَانِ الرَّحِيمِ ۝٣ مَالِكِ يَوْمِ الدِّينِ ۝٤ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ۝٥ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ ۝٦ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلاَ الضَّالِّينَ ۝٧﴾",r:"الفاتحة: ١–٧ (بالبسملة)"},
{x:"﴿الم ۝١ ذَلِكَ الْكِتَابُ لاَ رَيْبَ فِيهِ هُدَىً لِلْمُتَّقِينَ ۝٢ الَّذِينَ يُؤْمِنُونَ بِالْغَيْبِ وَيُقِيمُونَ الصَّلاَةَ وَمِمَّا رَزَقْنَاهُمْ يُنْفِقُونَ ۝٣ وَالَّذِينَ يُؤْمِنُونَ بِمَا أُنْزِلَ إِلَيْكَ وَمَا أُنْزِلَ مِنْ قَبْلِكَ وَبِالآْخِرَةِ هُمْ يُوقِنُونَ ۝٤ أُولَئِكَ عَلَى هُدَىً مِنْ رَبِّهِمْ وَأُولَئِكَ هُمُ الْمُفْلِحُونَ ۝٥﴾",r:"البقرة: ١–٥"},
{x:"﴿وَاتَّبَعُوا مَا تَتْلُوا الشَّيَاطِينُ عَلَى مُلْكِ سُلَيْمَانَ وَمَا كَفَرَ سُلَيْمَانُ وَلَكِنَّ الشَّيَاطِينَ كَفَرُوا يُعَلِّمُونَ النَّاسَ السِّحْرَ وَمَا أُنْزِلَ عَلَى الْمَلَكَيْنِ بِبَابِلَ هَارُوتَ وَمَارُوتَ وَمَا يُعَلِّمَانِ مِنْ أَحَدٍ حَتَّى يَقُولاَ إِنَّمَا نَحْنُ فِتْنَةٌ فَلاَ تَكْفُرْ فَيَتَعَلَّمُونَ مِنْهُمَا مَا يُفَرِّقُونَ بِهِ بَيْنَ الْمَرْءِ وَزَوْجِهِ وَمَا هُمْ بِضَآرِّينَ بِهِ مِنْ أَحَدٍ إِلاَّ بِإِذْنِ اللَّهِ وَيَتَعَلَّمُونَ مَا يَضُرُّهُمْ وَلاَ يَنْفَعُهُمْ وَلَقَدْ عَلِمُوا لَمَنِ اُشْتَرَاهُ مَا لَهُ فِي الآخِرَةِ مِنْ خَلاَقٍ وَلَبِئْسَ مَا شَرَوْا بِهِ أَنْفُسَهُمْ لَوْ كَانُوا يَعْلَمُونَ ۝١٠٢﴾",r:"البقرة: ١٠٢"},
{x:"﴿اللَّهُ لاَ إِلهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الأَْرْضِ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلاَ يُحِيطُونَ بِشَيءٍ مِنْ عِلْمِهِ إِلاَّ بِمَا شَاءَ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالأَْرْضَ وَلاَ يَؤُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ ۝٢٥٥﴾",r:"آية الكرسي — البقرة: ٢٥٥"},
{x:"﴿آمَنَ الرَّسُولُ بِمَا أُنْزِلَ إِلَيْهِ مِنْ رَبِّهِ وَالْمُؤْمِنُونَ كُلٌّ آمَنَ بِاللَّهِ وَمَلاَئِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لاَ نُفَرِّقُ بَيْنَ أَحَدٍ مِنْ رُسُلِهِ وَقَالُوا سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ۝٢٨٥ لاَ يُكَلِّفُ اللَّهُ نَفْسًا إِلاَّ وُسْعَهَا لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ رَبَّنَا لاَ تُؤَاخِذْنَا إِنْ نَسِيْنَا أَوْ أَخْطَأْنَا رَبَّنَا وَلاَ تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِنْ قَبْلِنَا رَبَّنَا وَلاَ تُحَمِّلْنَا مَا لاَ طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا أَنْتَ مَوْلاَنَا فَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ ۝٢٨٦﴾",r:"البقرة: ٢٨٥–٢٨٦"},
{x:"﴿الم ۝١ اللَّهُ لاَ إِلهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ ۝٢﴾",r:"آل عمران: ١–٢"},
{x:"﴿قُلِ اللَّهُمَّ مَالِكَ الْمُلْكِ تُؤْتِي الْمُلْكَ مَنْ تَشَاءُ وَتَنْزِعُ الْمُلْكَ مِمَّنْ تَشَاءُ وَتُعِزُّ مَنْ تَشَاءُ وَتُذِلُّ مَنْ تَشَاءُ بِيَدِكَ الْخَيْرُ إِنَّكَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ۝٢٦ تُولِجُ اللَّيْلَ فِي النَّهَارِ وَتُولِجُ النَّهَارَ فِي اللَّيْلِ وَتُخْرِجُ الْحَيَّ مِنَ الْمَيِّتِ وَتُخْرِجُ الْمَيِّتَ مِنَ الْحَيِّ وَتَرْزُقُ مَنْ تَشَاءُ بِغَيْرِ حِسَابٍ ۝٢٧﴾",r:"آل عمران: ٢٦–٢٧"},
{x:"﴿قُلْ إِنَّ الْفَضْلَ بِيَدِ اللَّهِ يُؤْتِيهِ مَنْ يَشَاءُ وَاللَّهُ وَاسِعٌ عَلِيمٌ ۝٧٣ يَخْتَصُّ بِرَحْمَتِهِ مَنْ يَشَاءُ وَاللَّهُ ذُو الْفَضْلِ الْعَظِيمِ ۝٧٤﴾",r:"آل عمران: ٧٣ (آخرها)–٧٤"},
{x:"﴿أَمْ يَحْسُدُونَ النَّاسَ عَلَى مَا آتَاهُمُ اللَّهُ مِنْ فَضْلِهِ فَقَدْ آتَيْنَا آلَ إِبْرَاهِيمَ الْكِتَابَ وَالْحِكْمَةَ وَآتَيْنَاهُمْ مُلْكًا عَظِيمًا ۝٥٤﴾",r:"النساء: ٥٤"},
{x:"﴿وَلَهُ مَا سَكَنَ فِي اللَّيْلِ وَالنَّهَارِ وَهُوَ السَّمِيعُ الْعَلِيمُ ۝١٣﴾",r:"الأنعام: ١٣"},
{x:"﴿ذَلِكُمُ اللَّهُ رَبُّكُمْ لاَ إِلهَ إِلاَّ هُوَ خَالِقُ كُلِّ شَيْءٍ فَاعْبُدُوهُ وَهُوَ عَلَى كُلِّ شَيْءٍ وَكِيلٌ ۝١٠٢ لاَ تُدْرِكُهُ الأَْبْصَارُ وَهُوَ يُدْرِكُ الأَْبْصَارَ وَهُوَ اللَّطِيفُ الْخَبِيرُ ۝١٠٣﴾",r:"الأنعام: ١٠٢–١٠٣"},
{x:"﴿وَالَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لاَ نُكَلِّفُ نَفْسًا إِلاَّ وُسْعَهَا أُولَئِكَ أَصْحَابُ الْجَنَّةِ هُمْ فِيهَا خَالِدُونَ ۝٤٢ وَنَزَعْنَا مَا فِي صُدُورِهِمْ مِنْ غِلٍّ تَجْرِي مِنْ تَحْتِهِمُ الأَْنْهَارُ وَقَالُوا الْحَمْدُ لِلَّهِ الَّذِي هَدَانَا لِهَذَا وَمَا كُنَّا لِنَهْتَدِيَ لَوْلاَ أَنْ هَدَانَا اللَّهُ لَقَدْ جَاءَتْ رُسُلُ رَبِّنَا بِالْحَقِّ وَنُودُوا أَنْ تِلْكُمُ الْجَنَّةُ أُورِثْتُمُوهَا بِمَا كُنْتُمْ تَعْمَلُونَ ۝٤٣﴾",r:"الأعراف: ٤٢–٤٣"},
{x:"﴿إِنَّ رَبَّكُمُ اللَّهُ الَّذِي خَلَقَ السَّمَاوَاتِ وَالأَْرْضَ فِي سِتَّةِ أَيَّامٍ ثُمَّ اسْتَوَى عَلَى الْعَرْشِ يُغْشِي اللَّيْلَ النَّهَارَ يَطْلُبُهُ حَثِيثًا وَالشَّمْسَ وَالْقَمَرَ وَالنُّجُومَ مُسَخَّرَاتٍ بَأَمْرِهِ أَلاَ لَهُ الْخَلْقُ وَالأَْمْرُ تَبَارَكَ اللَّهُ رَبُّ الْعَالَمِينَ ۝٥٤ ادْعُوا رَبَّكُمْ تَضَرُّعًا وَخُفْيَةً إِنَّهُ لاَ يُحِبُّ الْمُعْتَدِينَ ۝٥٥ وَلاَ تُفْسِدُوا فِي الأَْرْضِ بَعْدَ إِصْلاَحِهَا وَادْعُوهُ خَوْفًا وَطَمَعًا إِنَّ رَحْمَةَ اللَّهِ قَرِيبٌ مِنَ الْمُحْسِنِينَ ۝٥٦﴾",r:"الأعراف: ٥٤–٥٦"},
{x:"﴿وَأَوْحَيْنَا إِلَى مُوسَى أَنْ أَلْقِ عَصَاكَ فَإِذَا هِيَ تَلْقَفُ مَا يَأْفِكُونَ ۝١١٧ فَوَقَعَ الْحَقُّ وَبَطَلَ مَا كَانُوا يَعْمَلُونَ ۝١١٨ فَغُلِبُوا هُنَالِكَ وَانْقَلَبُوا صَاغِرِينَ ۝١١٩ وَأُلْقِيَ السَّحَرَةُ سَاجِدِينَ ۝١٢٠ قَالُوا آمَنَّا بِرَبِّ الْعَالَمِينَ ۝١٢١ رَبِّ مُوسَى وَهَارُونَ ۝١٢٢﴾",r:"الأعراف: ١١٧–١٢٢"},
{x:"﴿قَاتِلُوهُمْ يُعَذِّبْهُمُ اللَّهُ بِأَيْدِيكُمْ وَيُخْزِهِمْ وَيَنْصُرْكُمْ عَلَيْهِمْ وَيَشْفِ صُدُورَ قَوْمٍ مُؤْمِنِينَ ۝١٤ وَيُذْهِبْ غَيْظَ قُلُوبِهِمْ وَيَتُوبُ اللَّهُ عَلَى مَنْ يَشَاءُ وَاللَّهُ عَلِيمٌ حَكِيمٌ ۝١٥﴾",r:"التوبة: ١٤–١٥"},
{x:"﴿لَقَدْ جَاءَكُمْ رَسُولٌ مِنْ أَنْفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْ حَرِيصٌ عَلَيْكُمْ بِالْمُؤْمِنِينَ رَؤُوفٌ رَحِيمٌ ۝١٢٨ فَإِنْ تَوَلَّوْا فَقُلْ حَسْبِيَ اللَّهُ لاَ إِلهَ إِلاَّ هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ ۝١٢٩﴾",r:"التوبة: ١٢٨–١٢٩"},
{x:"﴿يَاأَيُّهَا النَّاسُ قَدْ جَاءَتْكُمْ مَوْعِظَةٌ مِنْ رَبِّكُمْ وَشِفَاءٌ لِمَا فِي الصُّدُورِ وَهُدىً وَرَحْمَةٌ لِلْمُؤْمِنِينَ ۝٥٧﴾",r:"يونس: ٥٧"},
{x:"﴿وَقَالَ فِرْعَوْنُ ائْتُونِي بِكُلِّ سَاحِرٍ عَلِيمٍ ۝٧٩ فَلَمَّا جَاءَ السَّحَرَةُ قَالَ لَهُمْ مُوسَى أَلْقُوا مَا أَنْتُمْ مُلْقُونَ ۝٨٠ فَلَمَّا أَلْقَوْا قَالَ مُوسَى مَا جِئْتُمْ بِهِ السِّحْرُ إِنَّ اللَّهَ سَيُبْطِلُهُ إِنَّ اللَّهَ لاَ يُصْلِحُ عَمَلَ الْمُفْسِدِينَ ۝٨١ وَيُحِقُّ اللَّهُ الْحَقَّ بِكَلِمَاتِهِ وَلَوْ كَرِهَ الْمُجْرِمُونَ ۝٨٢﴾",r:"يونس: ٧٩–٨٢"},
{x:"﴿وَإِنْ يَمْسَسْكَ اللَّهُ بِضُرٍّ فَلاَ كَاشِفَ لَهُ إِلاَّ هُوَ وَإِنْ يُرِدْكَ بِخَيْرٍ فَلاَ رَادَّ لِفَضْلِهِ يُصِيبُ بِهِ مَنْ يَشَاءُ مِنْ عِبَادِهِ وَهُوَ الْغَفُورُ الرَّحِيمُ ۝١٠٧﴾",r:"يونس: ١٠٧"},
{x:"﴿قَالَ هَلْ آمَنُكُمْ عَلَيْهِ إِلاَّ كَمَا أَمِنْتُكُمْ عَلَى أَخِيهِ مِنْ قَبْلُ فَاللَّهُ خَيْرٌ حَافِظًا وَهُوَ أَرْحَمُ الرَّاحِمِينَ ۝٦٤﴾",r:"يوسف: ٦٤"},
{x:"﴿أَتَى أَمْرُ اللَّهِ فَلاَ تَسْتَعْجِلُوهُ سُبْحَانَهُ وَتَعَالَى عَمَّا يُشْرِكُونَ ۝١ يُنَزِّلُ الْمَلاَئِكَةَ بِالرُّوحِ مِنْ أَمْرِهِ عَلَى مَنْ يَشَاءُ مِنْ عِبَادِهِ أَنْ أَنْذِرُوا أَنَّهُ لاَ إِلهَ إِلاَّ أَنَا فَاتَّقُونِ ۝٢ خَلَقَ السَّمَاوَاتِ وَالأَْرْضَ بِالْحَقِّ تَعَالَى عَمَّا يُشْرِكُونَ ۝٣﴾",r:"النحل: ١–٣"},
{x:"﴿وَأَوْحَى رَبُّكَ إِلَى النَّحْلِ أَنِ اتَّخِذِي مِنَ الْجِبَالِ بُيُوتًا وَمِنَ الشَّجَرِ وَمِمَّا يَعْرِشُونَ ۝٦٨ ثُمَّ كُلِي مِنْ كُلِّ الثَّمَرَاتِ فَاسْلُكِي سُبُلَ رَبِّكِ ذُلُلاً يَخْرُجُ مِنْ بُطُونِهَا شَرَابٌ مُخْتَلِفٌ أَلْوَانُهُ فِيهِ شِفَاءٌ لِلنَّاسِ إِنَّ فِي ذَلِكَ لآَيَةً لِقَوْمٍ يَتَفَكَّرُونَ ۝٦٩﴾",r:"النحل: ٦٨–٦٩"},
{x:"﴿وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِلْمُؤْمِنِينَ وَلاَ يَزِيدُ الظَّالِمِينَ إِلاَّ خَسَارًا ۝٨٢﴾",r:"الإسراء: ٨٢"},
{x:"﴿قُلْ ادْعُوا اللَّهَ أَوْ ادْعُوا الرَّحْمَانَ أَيًّا مَا تَدْعُوا فَلَهُ الأَْسْمَاءُ الْحُسْنَى وَلاَ تَجْهَرْ بِصَلاَتِكَ وَلاَ تُخَافِتْ بِهَا وَابْتَغِ بَيْنَ ذَلِكَ سَبِيلاً ۝١١٠ وَقُلِ الْحَمْدُ لِلَّهِ الَّذِي لَمْ يَتَّخِذْ وَلَدًا وَلَمْ يَكُنْ لَهُ شَرِيكٌ فِي الْمُلْكِ وَلَمْ يَكُنْ لَهُ وَلِيٌّ مِنَ الذُّلِّ وَكَبِّرْهُ تَكْبِيرًا ۝١١١﴾",r:"الإسراء: ١١٠–١١١"},
{x:"﴿وَلَوْلاَ إِذْ دَخَلْتَ جَنَّتَكَ قُلْتَ مَا شَاءَ اللَّهُ لاَ قُوَّةَ إِلاَّ بِاللَّهِ إِنْ تَرَنِ أَنَا أَقَلَّ مِنْكَ مَالاً وَوَلَدًا ۝٣٩﴾",r:"الكهف: ٣٩"},
{x:"﴿قَالُوا يَامُوسَى إِمَّا أَنْ تُلْقِيَ وَإِمَّا أَنْ نَكُونَ أَوَّلَ مَنْ أَلْقَى ۝٦٥ قَالَ بَلْ أَلْقُوا فَإِذَا حِبَالُهُمْ وَعِصِيُّهُمْ يُخَيَّلُ إِلَيْهِ مِنْ سِحْرِهِمْ أَنَّهَا تَسْعَى ۝٦٦ فَأَوْجَسَ فِي نَفْسِهِ خِيفَةً مُوسَى ۝٦٧ قُلْنَا لاَ تَخَفْ إِنَّكَ أَنْتَ الأَْعْلَى ۝٦٨ وَأَلْقِ مَا فِي يَمِينِكَ تَلْقَفْ مَا صَنَعُوا إِنَّمَا صَنَعُوا كَيْدُ سَاحِرٍ وَلاَ يُفْلِحُ السَّاحِرُ حَيْثُ أَتَى ۝٦٩﴾",r:"طه: ٦٥–٦٩"},
{x:"﴿أَفَحَسِبْتُمْ أَنَّمَا خَلَقْنَاكُمْ عَبَثًا وَأَنَّكُمْ إِلَيْنَا لاَ تُرْجَعُونَ ۝١١٥ فَتَعَالَى اللَّهُ الْمَلِكُ الْحَقُّ لاَ إِلهَ إِلاَّ هُوَ رَبُّ الْعَرْشِ الْكَرِيمِ ۝١١٦ وَمَنْ يَدْعُ مَعَ اللَّهِ إِلهًا آخَرَ لاَ بُرْهَانَ لَهُ بِهِ فَإِنَّمَا حِسَابُهُ عِنْدَ رَبِّهِ إِنَّهُ لاَ يُفْلِحُ الْكَافِرُونَ ۝١١٧ وَقُلْ رَبِّ اغْفِرْ وَارْحَمْ وَأَنْتَ خَيْرُ الرَّاحِمِينَ ۝١١٨﴾",r:"المؤمنون: ١١٥–١١٨"},
{x:"﴿قَالَ لَهُمْ مُوسَى أَلْقُوا مَا أَنْتُمْ مُلْقُونَ ۝٤٣ فَأَلْقَوْا حِبَالَهُمْ وَعِصِيَّهُمْ وَقَالُوا بِعِزَّةِ فِرْعَوْنَ إِنَّا لَنَحْنُ الْغَالِبُونَ ۝٤٤ فَأَلْقَى مُوسَى عَصَاهُ فَإِذَا هِيَ تَلْقَفُ مَا يَأْفِكُونَ ۝٤٥ فَأُلْقِيَ السَّحَرَةُ سَاجِدِينَ ۝٤٦ قَالُوا آمَنَّا بِرَبِّ الْعَالَمِينَ ۝٤٧ رَبِّ مُوسَى وَهَارُونَ ۝٤٨﴾",r:"الشعراء: ٤٣–٤٨"},
{x:"﴿وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ ۝٨٠﴾",r:"الشعراء: ٨٠"},
{x:"﴿أَمَّنْ يُجِيبُ الْمُضْطَرَّ إِذَا دَعَاهُ وَيَكْشِفُ السُّوءَ وَيَجْعَلُكُمْ خُلَفَاءَ الأَْرْضِ أَإِلهٌ مَعَ اللَّهِ قَلِيلاً مَا تَذَكَّرُونَ ۝٦٢﴾",r:"النمل: ٦٢"},
{x:"﴿مَا يَفْتَحِ اللَّهُ لِلنَّاسِ مِنْ رَحْمَةٍ فَلاَ مُمْسِكَ لَهَا وَمَا يُمْسِكْ فَلاَ مُرْسِلَ لَهُ مِنْ بَعْدِهِ وَهُوَ الْعَزِيزُ الْحَكِيمُ ۝٢﴾",r:"فاطر: ٢"},
{x:"﴿يس ۝١ وَالْقُرْآنِ الْحَكِيمِ ۝٢ إِنَّكَ لَمِنَ الْمُرْسَلِينَ ۝٣ عَلَى صِرَاطٍ مُسْتَقِيمٍ ۝٤ تَنْزِيلَ الْعَزِيزِ الرَّحِيمِ ۝٥ لِتُنْذِرَ قَوْمًا مَا أُنْذِرَ آبَاؤُهُمْ فَهُمْ غَافِلُونَ ۝٦ لَقَدْ حَقَّ الْقَوْلُ عَلَى أَكْثَرِهِمْ فَهُمْ لاَ يُؤْمِنُونَ ۝٧ إِنَّا جَعَلْنَا فِي أَعْنَاقِهِمْ أَغْلاَلاً فَهِيَ إِلَى الأَْذْقَانِ فَهُمْ مُقْمَحُونَ ۝٨ وَجَعَلْنَا مِنْ بَيْنِ أَيْدِيهِمْ سَدًّا وَمِنْ خَلْفِهِمْ سَدًّا فَأَغْشَيْنَاهُمْ فَهُمْ لاَ يُبْصِرُونَ ۝٩﴾",r:"يس: ١–٩"},
{x:"﴿وَالصَّآفَّاتِ صَفًّا ۝١ فَالزَّاجِرَاتِ زَجْرًا ۝٢ فَالتَّالِيَاتِ ذِكْرًا ۝٣ إِنَّ إِلهَكُمْ لَوَاحِدٌ ۝٤ رَبُّ السَّمَاوَاتِ وَالأَْرْضِ وَمَا بَيْنَهُمَا وَرَبُّ الْمَشَارِقِ ۝٥ إِنَّا زَيَّنَّا السَّمَاءَ الدُّنْيَا بِزِينَةٍ الْكَوَاكِبِ ۝٦ وَحِفْظًا مِنْ كُلِّ شَيْطَانٍ مَارِدٍ ۝٧ لاَ يَسَّمَّعُونَ إِلَى الْمَلإَِ الأَْعْلَى وَيُقْذَفُونَ مِنْ كُلِّ جَانِبٍ ۝٨ دُحُورًا وَلَهُمْ عَذَابٌ وَاصِبٌ ۝٩ إِلاَّ مَنْ خَطِفَ الْخَطْفَةَ فَأَتْبَعَهُ شِهَابٌ ثَاقِبٌ ۝١٠﴾",r:"الصافات: ١–١٠"},
{x:"﴿أَلَيْسَ اللَّهُ بِكَافٍ عَبْدَهُ وَيُخَوِّفُونَكَ بِالَّذِينَ مِنْ دُونِهِ وَمَنْ يُضْلِلِ اللَّهُ فَمَا لَهُ مِنْ هَادٍ ۝٣٦﴾",r:"الزمر: ٣٦"},
{x:"﴿وَيُنَجِّي اللَّهُ الَّذِينَ اتَّقَوْا بِمَفَازَتِهِمْ لاَ يَمَسُّهُمُ السُّوءُ وَلاَ هُمْ يَحْزَنُونَ ۝٦١﴾",r:"الزمر: ٦١"},
{x:"﴿وَلَوْ جَعَلْنَاهُ قُرْآنًا أَعْجَمِيًّا لَقَالُوا لَوْلاَ فُصِّلَتْ آيَاتُهُ أَأَعْجَمِيٌّ وَعَرَبِيٌّ قُلْ هُوَ لِلَّذِينَ آمَنُوا هُدىً وَشِفَاءٌ ۝٤٤﴾",r:"فصلت: ٤٤"},
{x:"﴿لَوْ أَنْزَلْنَا هَذَا الْقُرْآنَ عَلَى جَبَلٍ لَرَأَيْتَهُ خَاشِعًا مُتَصَدِّعًا مِنْ خَشْيَةِ اللَّهِ وَتِلْكَ الأَْمْثَالُ نَضْرِبُهَا لِلنَّاسِ لَعَلَّهُمْ يَتَفَكَّرُونَ ۝٢١ هُوَ اللَّهُ الَّذِي لاَ إِلهَ إِلاَّ هُوَ عَالِمُ الْغَيْبِ وَالشَّهَادَةِ هُوَ الرَّحْمَانُ الرَّحِيمُ ۝٢٢ هُوَ اللَّهُ الَّذِي لاَ إِلهَ إِلاَّ هُوَ الْمَلِكُ الْقُدُّوسُ السَّلاَمُ الْمُؤْمِنُ الْمُهَيْمِنُ الْعَزِيزُ الْجَبَّارُ الْمُتَكَبِّرُ سُبْحَانَ اللَّهِ عَمَّا يُشْرِكُونَ ۝٢٣ هُوَ اللَّهُ الْخَالِقُ الْبَارِىءُ الْمُصَوِّرُ لَهُ الأَْسْمَاءُ الْحُسْنَى يُسَبِّحُ لَهُ مَا فِي السَّمَاوَاتِ وَالأَْرْضِ وَهُوَ الْعَزِيزُ الْحَكِيمُ ۝٢٤﴾",r:"الحشر: ٢١–٢٤"},
{x:"﴿أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ ۝١ وَوَضَعْنَا عَنْكَ وِزْرَكَ ۝٢ الَّذِي أَنْقَضَ ظَهْرَكَ ۝٣ وَرَفَعْنَا لَكَ ذِكْرَكَ ۝٤ فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ۝٥ إِنَّ مَعَ الْعُسْرِ يُسْرًا ۝٦ فَإِذَا فَرَغْتَ فَانْصَبْ ۝٧ وَإِلَى رَبِّكَ فَارْغَبْ ۝٨﴾",r:"الشرح: ١–٨"},
{x:"﴿قُلْ يَاأَيُّهَا الْكَافِرُونَ ۝١ لاَ أَعْبُدُ مَا تَعْبُدُونَ ۝٢ وَلاَ أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ ۝٣ وَلاَ أَنَا عَابِدٌ مَا عَبَدْتُّمْ ۝٤ وَلاَ أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ ۝٥ لَكُمْ دِينُكُمْ وَلِيَ دِينِ ۝٦﴾",r:"الكافرون: ١–٦"},
{x:"﴿قُلْ هُوَ اللَّهُ أَحَدٌ ۝١ اللَّهُ الصَمَدُ ۝٢ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝٣ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ ۝٤﴾",r:"الإخلاص: ١–٤"},
{x:"﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝١ مِنْ شَرِّ مَا خَلَقَ ۝٢ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝٣ وَمِنْ شَرِّ النَفَّاثَاتِ فِي الْعُقَدِ ۝٤ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ ۝٥﴾",r:"الفلق: ١–٥"},
{x:"﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝١ مَلِكِ النَّاسِ ۝٢ إِلهِ النَّاسِ ۝٣ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝٤ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝٥ مِنَ الْجِنَّةِ وَالنَّاسِ ۝٦﴾",r:"الناس: ١–٦"}]},
{t:"الاستهلال من السنة",i:[
{x:"«لاَ إِلهَ إِلاَّ اللهُ الْعَظِيمُ الْحَلِيمُ، لاَ إِلهَ إِلاَّ اللهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لاَ إِلهَ إِلاَّ اللهُ رَبُّ السَّموَاتِ وَرَبُّ الأَْرْضِ، وَرَبُّ الْعَرْشِ الْكَرِيمِ»"},
{x:"«لاَ إِلهَ إِلاَّ اللهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، اللَّهُمَّ لاَ مَانِعَ لِمَا أَعْطَيْتَ وَلاَ مُعْطِيَ لِمَا مَنَعْتَ، وَلاَ يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ»"},
{x:"«لاَ إِلهَ إِلاَّ اللهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللهِ، لاَ إِلهَ إِلاَّ اللهُ، وَلاَ نَعْبُدُ إِلاَّ إِيَّاهُ، لَهُ النِّعْمَةُ وَلَهُ الْفَضْلُ، وَلَهُ الثَّنَاءُ الْحَسَنُ، لاَ إِلهَ إِلاَّ اللهُ مُخْلِصِينَ لَهُ الدِّينَ وَلَوْ كَرِهَ الْكَافِرُونَ»"}]},
{t:"الرقية من السنة",i:[
{x:"«أَعُوذُ بِاللهِ السَّمِيعِ الْعَلِيمِ مِنَ الشَّيْطَانِ الرَّجِيمِ، مِنْ هَمْزِهِ وَنَفْخِهِ وَنَفْثِهِ»"},
{x:"«أَعُوذُ بِوَجْهِ اللهِ الْكَرِيمِ، وَبِكَلِمَاتِ اللهِ التَّامَّاتِ، اللاَّتِي لاَ يُجَاوِزُهُنَّ بَرٌّ وَلاَ فَاجِرٌ، مِنْ شَرِّ مَا يَنْزِلُ مِنَ السَّمَاءِ وَشَرِّ مَا يَعْرُجُ فِيهَا، وَشَرِّ مَا ذَرَأَ فِي الأَْرْضِ وَشَرِّ مَا يَخْرُجُ مِنْهَا، وَمِنْ فِتَنِ اللَّيْلِ وَالنَّهَارِ، وَمِنْ طَوَارِقِ اللَّيْلِ وَالنَّهَارِ، إِلاَّ طَارِقًا يَطْرُقُ بِخَيْرٍ يَا رَحْمنُ»"},
{x:"«أُعِيذُكَ بِكَلِمَاتِ اللهِ التَّامَّةِ، مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ، وَمِنْ كُلِّ عَيْنٍ لاَمَّةٍ»"},
{x:"«بِسْمِ اللهِ (ثلاثًا)، أَعُوذُ بِاللهِ (١) وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ» (سبع مرات)",c:7,r:"صحيح مسلم (٢٢٠٢) من حديث عثمان بن أبي العاص؛ والترمذي (٣٥٨٨) من حديث أنس",n:"(١) المثبت هو رواية مسلم؛ كتاب: السلام، باب: استحباب وضع يده على موضع الألم مع الدعاء، برقم (٢٢٠٢)، عن عثمان بن أبي العاص الثقفي ﵁. وعند الترمذي بلفظ: «أَعُوذُ بِعِزَّةِ اللهِ وَقُدْرَتِهِ ...» الحديث، برقم (٣٥٨٨)، عن أنس ﵁."},
{x:"«بِسْمِ اللهِ أَرْقِيكَ، مِنْ كُلِّ شَيْءٍ يُؤْذِيكَ، مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنِ حَاسِدٍ، اللهُ يَشْفِيكَ، بِسْمِ اللهِ أَرْقِيكَ»"},
{x:"«بِسْمِ اللهِ، تُرْبَةُ أَرْضِنَا بِرِيقَةِ بَعْضِنَا يُشْفى سَقِيمُنَا بِإِذْنِ رَبِّنَا» (١)",n:"(١) إن كان بالمريض قَرْحة أو جرح، وضع الراقي من ريق نفسه على إصبعه السبّابة، ثم وضعها على تراب، بحيث يَعلَق به شيء منه، ثم يمسح به الموضع العليل المتقرح أو الجريح، ثم يدعو بهذا الدعاء، ويراعى في ذلك أن لا يكون المرقيُّ امرأة أجنبية."},
{x:"«اللهُمَّ، أَذْهِبِ الْبَاسَ، رَبَّ النَّاسِ، اشْفِ وَأَنْتَ الشَّافِي، لاَ شِفَاءَ إِلاَّ شِفَاؤُكَ، شِفَاءً لاَ يُغَادِرُ سَقَماً»"},
{x:"«اللهُمَّ اشْفِ عَبْدَك يَنْكَأْ لَكَ عُدُوًا، أَوْ يَمْشِي لَكَ إِلَى صَلاَةٍ»"},
{x:"«اللهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ فِي الدُّنْيَا وَالآخِرَةِ، اللهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ، وَأَهْلِي وَمَالِي، اللهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي، وَعَنْ يَمِينِي وَعَنْ شِمَالِي، وَمِنْ فَوقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي»"},
{x:"«اللهُمَّ اهْدِنِي، وَارْزُقْنِي، وَعَافِنِي، وَارْحَمْنِي»"},
{x:"«اللهُمَّ بَارِكْ عَلَيْهِ، وَأَذْهِبْ عَنْهُ حَرَّ الْعَيْنِ وَبَرْدَهَا وَوَصَبَهَا» (١)",n:"(١) إن وجد الراقي في وجه المريض سفعةً (اصفرارًا، أو اسودادًا، أو تغيّر لون) من عينٍ ألمّت به، دعا بهذا الدعاء. والوَصَب: دوام الوجع ولزومُه، وقد يُطلق على التعب والفتور في البدن، انظر: النهاية لابن الأثير (٥/١٦٦)."},
{x:"«اللهُمَّ إِنِّي أَعُوذُ بِوَجْهِكَ الْكَرِيمِ وَكَلِمَاتِكَ التَّامَّةِ، مِنْ شَرِّ مَا أَنْتَ آخِذٌ بِنَاصِيَتِهِ، اللهُمَّ أَنْتَ تَكْشِفُ الْمَأْثَمَ وَالْمَغْرَمَ، اللهُمَّ لاَ يُهْزَمُ جُنْدُكَ، وَلاَ يُخْلَفُ وَعْدُكَ، وَلاَ يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ، سُبْحَانَكَ وَبِحَمْدِكَ»"},
{x:"«رَبُّنَا اللهُ الَّذِي فِي السَّمَاءِ تَقَدَّسَ اسْمُكَ، أَمْرُكَ فِي السَّمَاءِ وَالأَْرْضِ، كَمَا رَحْمَتُكَ فِي السَّمَاءِ فَاجْعَلْ رَحْمَتَكَ فِي الأَْرْضِ، اغْفِرْ لَنَا حُوبَنَا وَخَطَايَانَا، أَنْتَ رَبُّ الطَّيِّبِينَ، أَنْزِلْ رَحْمَةً مِنْ رَحْمَتِكَ، وَشِفَاءً مِنْ شِفَائِكَ عَلَى هَذَا الْوَجَعِ فَيَبْرَأُ» (ثلاث مرات)",c:3},
{x:"«اللهُمَّ إِنِّي عَبْدُكَ، وَابْنُ عَبْدِكَ، وَابْنُ أَمَتِكَ، نَاصِيَتِي بِيَدِكَ، مَاضٍ فِيَّ حُكمُكَ، عَدْلٌ فِيَّ قَضَاؤُكَ، أَسْأَلُكَ بِكُلِّ اسْمٍ هُوَ لَكَ؛ سَمَّيْتَ بِهِ نَفْسَكَ، أَوْ أَنْزَلْتَهُ فِي كِتَابِكَ، أَوْ عَلَّمْتَهُ أَحَدًا مِنْ خَلْقِكَ، أَوِ اسْتَأْثَرْتَ بِهِ فِي عِلْمِ الْغَيْبِ عِنْدَكَ: أَنْ تَجْعَلَ الْقُرْآنَ رَبِيعَ قَلْبِي، وَنُورَ صَدْرِي، وَجَلاَءَ حُزْنِي، وَذَهابَ هَمِّي»"},
{x:"«اللهُمَّ إِنَّا نَسْأَلُكَ مِنْ خَيْرِ مَا سَأَلَكَ مِنْهُ نَبِيُّكَ مُحَمَّدٌ ﷺ، وَنَعُوذُ بِكَ مِنْ شَرِّ مَا اسْتَعَاذَ مِنْهُ نَبِيُّكَ مُحَمَّدٌ ﷺ، وَأَنْتَ الْمُسْتَعَانُ وَعَلَيْكَ الْبَلاَغُ، وَلاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللهِ»"},
{x:"«اللهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، اللهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ فِي الْعَالَمِينَ إِنَّكَ حَمِيدٌ مَجِيدٌ»"}]}
];

function slide([id,it]){if(it.nt)return `<section class="slide"><div class="in"><p class="tx emp">${it.x}</p></div></section>`;const n=cnt[id]||0;return `<section class="slide" id="sl${id}"><div class="in"><p class="tx">${it.x}</p>${it.n?`<details><summary>حاشية</summary><p>${it.n}</p></details>`:""}</div><div class="bar${it.c&&n>=it.c?" done":""}"><button class="src" data-o="${id}"><span>المصدر: <b>${shortSrc(it)}</b></span><span>›</span></button><button class="cb" data-id="${id}"><b>${lbl(id,it.c)}</b><small>العدّ</small></button><button data-r="${id}">↺<small>تصفير</small></button><button class="fv${st.fav[id]?" on":""}" data-f="${id}"><b>${st.fav[id]?"★":"☆"}</b><small>المفضلة</small></button><button data-c="${id}">⧉<small>نسخ</small></button><button data-sh="${id}">⇪<small>مشاركة</small></button></div></section>`}
function pos(){$("#ix").textContent=AR(Math.min(cur+1,$("#pg").children.length))+" / "+AR($("#pg").children.length)}
function list(){const a=items();$("#pg").innerHTML=a.length?a.map(slide).join(""):`<section class="slide"><div class="in"><p class="tx emp">لا توجد عناصر في المفضلة بعد. اضغط ☆ تحت أي آية أو حديث.</p></div></section>`;$("#pg").scrollLeft=0;cur=0;pos()}
function go(i){const c=$("#pg").children;i=Math.max(0,Math.min(c.length-1,i));c[i]&&c[i].scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"})}
function upd(id){const c=$("#sl"+id);if(!c)return;const it=IT(id),n=cnt[id]||0;c.querySelector(".cb b").textContent=lbl(id,it.c);c.querySelector(".bar").classList.toggle("done",!!it.c&&n>=it.c)}
function toast(m){const t=$("#ts");t.textContent=m;t.hidden=false;clearTimeout(t.h);t.h=setTimeout(()=>t.hidden=true,1500)}
const txt=id=>{const it=IT(id);return it.x+(it.r?"\n— "+it.r:"")+"\n(الرقية الشرعية — خالد الجريسي)"};
async function cp(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}toast("تم النسخ")}
function openSrc(id){const it=IT(id),q=it.x.includes("﴿");let h="";if(it.r)h+=`<h3>${q?"السورة والآيات":"المرجع"}</h3><div>${it.r}</div>`;if(it.k)h+=`<h3>تخريج المؤلف (كتاب الرقية الشرعية، الجريسي)</h3><div>${it.k}</div>`;
if(q){const m=(it.r||"").match(/([^:—]+):\s*([٠-٩]+)/),n=m&&SU[m[1].trim()];if(n)h+=`<a target="_blank" rel="noopener" href="https://quran.com/${n}/${m[2].replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))}">المصحف والتفسير — quran.com</a>`}
else h+=(it.k?"":"<div>لم يذكر المؤلف تخريجاً لهذا النص في موضعه.</div>")+`<a target="_blank" rel="noopener" href="https://dorar.net/hadith/search?q=${encodeURIComponent(nz(it.x).split(/\s+/).slice(0,8).join(" "))}">الدرر السنية — التخريج وحكم المحدثين</a>`;
h+=`<h3>ملاحظاتي</h3><textarea data-src="${id}" placeholder="أضف مصدراً أو ملاحظة">${st.src[id]||""}</textarea>`;$("#mb").innerHTML=h;$("#mw").dataset.z="mid";$("#mw").hidden=false}
function opts(el,arr,key){$(el).innerHTML=arr.map((a,i)=>{const v=Array.isArray(a)?a[0]:i,l=Array.isArray(a)?a[1]:a;return `<button data-k="${key}" data-v="${v}" class="${st[key]==v?"on":""}">${l}</button>`}).join("")}
function sheet(){opts("#o-th",TH,"th");opts("#o-ff",FN,"ff");document.querySelectorAll("#o-ff button").forEach((b,i)=>b.style.fontFamily=FF[i]);opts("#o-au",YN,"auto");opts("#o-wk",YN,"wake");$("#fs").value=st.fs;offst()}
async function offst(){let ok=false;try{ok=!!(navigator.serviceWorker&&navigator.serviceWorker.controller&&await caches.match("index.html"))}catch(e){}$("#off").textContent=ok?"✓ جاهز للعمل دون إنترنت":"✗ غير جاهز بعد — افتح الصفحة وأنت متصل ثم حدّثها مرتين"}
$("#pg").addEventListener("scroll",()=>{clearTimeout(tm);tm=setTimeout(()=>{const p=$("#pg");cur=Math.round(Math.abs(p.scrollLeft)/p.clientWidth);pos()},80)});
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
if(d.g!=null){st.g=+d.g;st.sec=0;save();tabs();list()}
else if(d.s!=null){st.sec=+d.s;save();tabs();list()}
else if(d.id){const c=IT(d.id).c,n=cnt[d.id]||0;if(c&&n>=c){if(st.auto)go(cur+1);return}cnt[d.id]=n+1;if(c&&n+1>=c){navigator.vibrate&&navigator.vibrate(60);if(st.auto)setTimeout(()=>go(cur+1),450)}upd(d.id)}
else if(d.r){delete cnt[d.r];upd(d.r)}
else if(d.f){if(st.fav[d.f])delete st.fav[d.f];else st.fav[d.f]=1;save();b.classList.toggle("on",!!st.fav[d.f]);b.querySelector("b").textContent=st.fav[d.f]?"★":"☆"}
else if(d.c)cp(txt(d.c));
else if(d.sh){navigator.share?navigator.share({text:txt(d.sh)}).catch(()=>{}):cp(txt(d.sh))}
else if(d.o)openSrc(d.o);
else if(d.w){const m=$("#mw");if(d.w=="x")m.hidden=true;else if(d.w=="min")m.dataset.z=m.dataset.z=="min"?"mid":"min";else m.dataset.z=m.dataset.z=="max"?"mid":"max"}
else if(d.k){st[d.k]=d.k=="th"?d.v:+d.v;save();apply();sheet()}
else if(b.id=="gear"){sheet();$("#sh").hidden=false}
else if(b.id=="rall"){cnt={};list()}
else if(b.id=="nx")go(cur+1);else if(b.id=="pv")go(cur-1)});
document.addEventListener("change",e=>{const i=e.target.dataset&&e.target.dataset.src;if(i!=null){st.src[i]=e.target.value;save()}});
document.addEventListener("keydown",e=>{if(e.target.tagName=="INPUT"||e.target.tagName=="TEXTAREA")return;if(e.key=="ArrowLeft")go(cur+1);if(e.key=="ArrowRight")go(cur-1)});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="visible")wake()});
$("#sh").addEventListener("click",e=>{if(e.target.id=="sh")e.target.hidden=true});
$("#fs").addEventListener("input",e=>{st.fs=+e.target.value;save();apply()});
apply();tabs();list();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
