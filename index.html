<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e6b52">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri&family=Noto+Naskh+Arabic&family=Scheherazade+New&family=Noto+Sans+Arabic&display=swap" rel="stylesheet">
<title>الرقية الشرعية</title>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--tx:#1f2a24;--ac:#1e6b52;--mu:#7a7468;--bd:#e4dccb;--fs:24px;--ff:serif}
[data-th=sepia]{--bg:#efe2c6;--card:#f7ecd3;--tx:#3b2e1a;--ac:#8a5a1b;--mu:#7d6a4c;--bd:#dccaa0}
[data-th=dark]{--bg:#101614;--card:#18211e;--tx:#e8e6df;--ac:#5fc4a0;--mu:#97a39d;--bd:#26332e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:env(safe-area-inset-top) 12px 0;border-bottom:1px solid var(--bd)}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 4px}
h1{font-size:18px;margin:0;color:var(--ac)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.ic{font-size:22px;padding:6px 10px;border-radius:10px;background:var(--card);border:1px solid var(--bd)}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.tab{white-space:nowrap;padding:7px 14px;border-radius:20px;background:var(--card);border:1px solid var(--bd);font-size:14px}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.card.done{border-color:var(--ac);opacity:.75}
.tx{font-family:var(--ff);font-size:var(--fs);line-height:2;margin:0;text-align:justify}
.rf{color:var(--mu);font-size:13px;margin-top:6px}
details{margin-top:8px;color:var(--mu);font-size:14px;line-height:1.8}summary{cursor:pointer}
.row{display:flex;gap:8px;margin-top:12px}
.cb{flex:1;min-height:48px;border-radius:12px;background:var(--ac);color:#fff;font-size:18px;font-weight:600;user-select:none}
.rs{padding:0 16px;border-radius:12px;border:1px solid var(--bd);color:var(--mu)}
#sh{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:9}
#sh[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:720px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{font-size:15px;margin:14px 0 8px;color:var(--mu)}.sheet h2:first-child{margin-top:0}
.opts{display:flex;gap:8px;flex-wrap:wrap}.opts button{flex:1 1 28%;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--bd)}
.opts button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
input[type=range]{width:100%;accent-color:var(--ac)}
.pv{font-family:var(--ff);font-size:var(--fs);text-align:center;margin:6px 0}
</style></head>
<body>
<header><div class="top"><h1>الرقية الشرعية</h1><button class="ic" id="gear" aria-label="الإعدادات">⚙</button></div><nav id="tabs"></nav></header>
<main id="list"></main>
<div id="sh" hidden><div class="sheet">
<h2>الثيم</h2><div class="opts" id="o-th"></div>
<h2>نوع الخط</h2><div class="opts" id="o-ff"></div>
<h2>حجم الخط</h2><input type="range" id="fs" min="16" max="44" step="1"><div class="pv">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
<h2>العدّادات</h2><div class="opts"><button id="rall">تصفير كل العدّادات</button></div>
</div></div>
<script>
const D=[
{t:"الاستهلال",i:[
{x:"أَعُوذُ بِاللهِ السَّمِيعِ الْعَلِيمِ مِنَ الشَّيْطَانِ الرَّجِيمِ ﷽"},
{x:"﴿الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ﴾",r:"الفاتحة: ٢"},
{x:"﴿وَلِلَّهِ الأَسْمَاءُ الْحُسْنَى فَادْعُوهُ بِهَا وَذَرُوا الَّذِينَ يُلْحِدُونَ فِي أَسْمَائِهِ سَيُجْزَوْنَ مَا كَانُوا يَعْمَلُونَ﴾",r:"الأعراف: ١٨٠"},
{x:"﴿الْحَمْدُ لِلَّهِ الَّذِي لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الأَرْضِ وَلَهُ الْحَمْدُ فِي الآخِرَةِ وَهُوَ الْحَكِيمُ الْخَبِيرُ﴾",r:"سبأ: ١"},
{x:"﴿هُوَ الْحَيُّ لاَ إِلَهَ إِلاَّ هُوَ فَادْعُوهُ مُخْلِصِينَ لَهُ الدِّينَ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ﴾",r:"غافر: ٦٥"}]},
{t:"الرقية من القرآن",i:[
{x:"﴿بِسْمِ اللَّهِ الرَّحْمَانِ الرَّحِيمِ ۝ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ۝ الرَّحْمَانِ الرَّحِيمِ ۝ مَالِكِ يَوْمِ الدِّينِ ۝ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ۝ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ ۝ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلاَ الضَّالِّينَ﴾",r:"سورة الفاتحة"},
{x:"﴿الم ۝ ذَلِكَ الْكِتَابُ لاَ رَيْبَ فِيهِ هُدَىً لِلْمُتَّقِينَ ۝ الَّذِينَ يُؤْمِنُونَ بِالْغَيْبِ وَيُقِيمُونَ الصَّلاَةَ وَمِمَّا رَزَقْنَاهُمْ يُنْفِقُونَ ۝ وَالَّذِينَ يُؤْمِنُونَ بِمَا أُنْزِلَ إِلَيْكَ وَمَا أُنْزِلَ مِنْ قَبْلِكَ وَبِالآْخِرَةِ هُمْ يُوقِنُونَ ۝ أُولَئِكَ عَلَى هُدَىً مِنْ رَبِّهِمْ وَأُولَئِكَ هُمُ الْمُفْلِحُونَ﴾",r:"البقرة: ١–٥"},
{x:"﴿وَاتَّبَعُوا مَا تَتْلُوا الشَّيَاطِينُ عَلَى مُلْكِ سُلَيْمَانَ وَمَا كَفَرَ سُلَيْمَانُ وَلَكِنَّ الشَّيَاطِينَ كَفَرُوا يُعَلِّمُونَ النَّاسَ السِّحْرَ وَمَا أُنْزِلَ عَلَى الْمَلَكَيْنِ بِبَابِلَ هَارُوتَ وَمَارُوتَ وَمَا يُعَلِّمَانِ مِنْ أَحَدٍ حَتَّى يَقُولاَ إِنَّمَا نَحْنُ فِتْنَةٌ فَلاَ تَكْفُرْ فَيَتَعَلَّمُونَ مِنْهُمَا مَا يُفَرِّقُونَ بِهِ بَيْنَ الْمَرْءِ وَزَوْجِهِ وَمَا هُمْ بِضَآرِّينَ بِهِ مِنْ أَحَدٍ إِلاَّ بِإِذْنِ اللَّهِ وَيَتَعَلَّمُونَ مَا يَضُرُّهُمْ وَلاَ يَنْفَعُهُمْ وَلَقَدْ عَلِمُوا لَمَنِ اُشْتَرَاهُ مَا لَهُ فِي الآخِرَةِ مِنْ خَلاَقٍ وَلَبِئْسَ مَا شَرَوْا بِهِ أَنْفُسَهُمْ لَوْ كَانُوا يَعْلَمُونَ﴾",r:"البقرة"},
{x:"﴿اللَّهُ لاَ إِلهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ لاَ تَأْخُذُهُ سِنَةٌ وَلاَ نَوْمٌ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الأَْرْضِ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلاَّ بِإِذْنِهِ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلاَ يُحِيطُونَ بِشَيءٍ مِنْ عِلْمِهِ إِلاَّ بِمَا شَاءَ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالأَْرْضَ وَلاَ يَؤُودُهُ حِفْظُهُمَا وَهُوَ الْعَلِيُّ الْعَظِيمُ﴾",r:"آية الكرسي — البقرة: ٢٥٥"},
{x:"﴿آمَنَ الرَّسُولُ بِمَا أُنْزِلَ إِلَيْهِ مِنْ رَبِّهِ وَالْمُؤْمِنُونَ كُلٌّ آمَنَ بِاللَّهِ وَمَلاَئِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ لاَ نُفَرِّقُ بَيْنَ أَحَدٍ مِنْ رُسُلِهِ وَقَالُوا سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ ۝ لاَ يُكَلِّفُ اللَّهُ نَفْسًا إِلاَّ وُسْعَهَا لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ رَبَّنَا لاَ تُؤَاخِذْنَا إِنْ نَسِيْنَا أَوْ أَخْطَأْنَا رَبَّنَا وَلاَ تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِنْ قَبْلِنَا رَبَّنَا وَلاَ تُحَمِّلْنَا مَا لاَ طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا أَنْتَ مَوْلاَنَا فَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ﴾",r:"البقرة: ٢٨٥–٢٨٦"},
{x:"﴿الم ۝ اللَّهُ لاَ إِلهَ إِلاَّ هُوَ الْحَيُّ الْقَيُّومُ﴾",r:"سورة آل عمران"},
{x:"﴿قُلِ اللَّهُمَّ مَالِكَ الْمُلْكِ تُؤْتِي الْمُلْكَ مَنْ تَشَاءُ وَتَنْزِعُ الْمُلْكَ مِمَّنْ تَشَاءُ وَتُعِزُّ مَنْ تَشَاءُ وَتُذِلُّ مَنْ تَشَاءُ بِيَدِكَ الْخَيْرُ إِنَّكَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ ۝ تُولِجُ اللَّيْلَ فِي النَّهَارِ وَتُولِجُ النَّهَارَ فِي اللَّيْلِ وَتُخْرِجُ الْحَيَّ مِنَ الْمَيِّتِ وَتُخْرِجُ الْمَيِّتَ مِنَ الْحَيِّ وَتَرْزُقُ مَنْ تَشَاءُ بِغَيْرِ حِسَابٍ﴾",r:"سورة آل عمران"},
{x:"﴿قُلْ إِنَّ الْفَضْلَ بِيَدِ اللَّهِ يُؤْتِيهِ مَنْ يَشَاءُ وَاللَّهُ وَاسِعٌ عَلِيمٌ ۝ يَخْتَصُّ بِرَحْمَتِهِ مَنْ يَشَاءُ وَاللَّهُ ذُو الْفَضْلِ الْعَظِيمِ﴾",r:"سورة آل عمران"},
{x:"﴿أَمْ يَحْسُدُونَ النَّاسَ عَلَى مَا آتَاهُمُ اللَّهُ مِنْ فَضْلِهِ فَقَدْ آتَيْنَا آلَ إِبْرَاهِيمَ الْكِتَابَ وَالْحِكْمَةَ وَآتَيْنَاهُمْ مُلْكًا عَظِيمًا﴾",r:"سورة النساء"},
{x:"﴿وَلَهُ مَا سَكَنَ فِي اللَّيْلِ وَالنَّهَارِ وَهُوَ السَّمِيعُ الْعَلِيمُ﴾",r:"سورة الأنعام"},
{x:"﴿ذَلِكُمُ اللَّهُ رَبُّكُمْ لاَ إِلهَ إِلاَّ هُوَ خَالِقُ كُلِّ شَيْءٍ فَاعْبُدُوهُ وَهُوَ عَلَى كُلِّ شَيْءٍ وَكِيلٌ ۝ لاَ تُدْرِكُهُ الأَْبْصَارُ وَهُوَ يُدْرِكُ الأَْبْصَارَ وَهُوَ اللَّطِيفُ الْخَبِيرُ﴾",r:"سورة الأنعام"},
{x:"﴿وَالَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ لاَ نُكَلِّفُ نَفْسًا إِلاَّ وُسْعَهَا أُولَئِكَ أَصْحَابُ الْجَنَّةِ هُمْ فِيهَا خَالِدُونَ ۝ وَنَزَعْنَا مَا فِي صُدُورِهِمْ مِنْ غِلٍّ تَجْرِي مِنْ تَحْتِهِمُ الأَْنْهَارُ وَقَالُوا الْحَمْدُ لِلَّهِ الَّذِي هَدَانَا لِهَذَا وَمَا كُنَّا لِنَهْتَدِيَ لَوْلاَ أَنْ هَدَانَا اللَّهُ لَقَدْ جَاءَتْ رُسُلُ رَبِّنَا بِالْحَقِّ وَنُودُوا أَنْ تِلْكُمُ الْجَنَّةُ أُورِثْتُمُوهَا بِمَا كُنْتُمْ تَعْمَلُونَ﴾",r:"سورة الأعراف"},
{x:"﴿إِنَّ رَبَّكُمُ اللَّهُ الَّذِي خَلَقَ السَّمَاوَاتِ وَالأَْرْضَ فِي سِتَّةِ أَيَّامٍ ثُمَّ اسْتَوَى عَلَى الْعَرْشِ يُغْشِي اللَّيْلَ النَّهَارَ يَطْلُبُهُ حَثِيثًا وَالشَّمْسَ وَالْقَمَرَ وَالنُّجُومَ مُسَخَّرَاتٍ بَأَمْرِهِ أَلاَ لَهُ الْخَلْقُ وَالأَْمْرُ تَبَارَكَ اللَّهُ رَبُّ الْعَالَمِينَ ۝ ادْعُوا رَبَّكُمْ تَضَرُّعًا وَخُفْيَةً إِنَّهُ لاَ يُحِبُّ الْمُعْتَدِينَ ۝ وَلاَ تُفْسِدُوا فِي الأَْرْضِ بَعْدَ إِصْلاَحِهَا وَادْعُوهُ خَوْفًا وَطَمَعًا إِنَّ رَحْمَةَ اللَّهِ قَرِيبٌ مِنَ الْمُحْسِنِينَ﴾",r:"سورة الأعراف"},
{x:"﴿وَأَوْحَيْنَا إِلَى مُوسَى أَنْ أَلْقِ عَصَاكَ فَإِذَا هِيَ تَلْقَفُ مَا يَأْفِكُونَ ۝ فَوَقَعَ الْحَقُّ وَبَطَلَ مَا كَانُوا يَعْمَلُونَ ۝ فَغُلِبُوا هُنَالِكَ وَانْقَلَبُوا صَاغِرِينَ ۝ وَأُلْقِيَ السَّحَرَةُ سَاجِدِينَ ۝ قَالُوا آمَنَّا بِرَبِّ الْعَالَمِينَ ۝ رَبِّ مُوسَى وَهَارُونَ﴾",r:"سورة الأعراف"},
{x:"﴿قَاتِلُوهُمْ يُعَذِّبْهُمُ اللَّهُ بِأَيْدِيكُمْ وَيُخْزِهِمْ وَيَنْصُرْكُمْ عَلَيْهِمْ وَيَشْفِ صُدُورَ قَوْمٍ مُؤْمِنِينَ ۝ وَيُذْهِبْ غَيْظَ قُلُوبِهِمْ وَيَتُوبُ اللَّهُ عَلَى مَنْ يَشَاءُ وَاللَّهُ عَلِيمٌ حَكِيمٌ﴾",r:"سورة التوبة"},
{x:"﴿لَقَدْ جَاءَكُمْ رَسُولٌ مِنْ أَنْفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْ حَرِيصٌ عَلَيْكُمْ بِالْمُؤْمِنِينَ رَؤُوفٌ رَحِيمٌ ۝ فَإِنْ تَوَلَّوْا فَقُلْ حَسْبِيَ اللَّهُ لاَ إِلهَ إِلاَّ هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ﴾",r:"سورة التوبة"},
{x:"﴿يَاأَيُّهَا النَّاسُ قَدْ جَاءَتْكُمْ مَوْعِظَةٌ مِنْ رَبِّكُمْ وَشِفَاءٌ لِمَا فِي الصُّدُورِ وَهُدىً وَرَحْمَةٌ لِلْمُؤْمِنِينَ﴾",r:"سورة يونس"},
{x:"﴿وَقَالَ فِرْعَوْنُ ائْتُونِي بِكُلِّ سَاحِرٍ عَلِيمٍ ۝ فَلَمَّا جَاءَ السَّحَرَةُ قَالَ لَهُمْ مُوسَى أَلْقُوا مَا أَنْتُمْ مُلْقُونَ ۝ فَلَمَّا أَلْقَوْا قَالَ مُوسَى مَا جِئْتُمْ بِهِ السِّحْرُ إِنَّ اللَّهَ سَيُبْطِلُهُ إِنَّ اللَّهَ لاَ يُصْلِحُ عَمَلَ الْمُفْسِدِينَ ۝ وَيُحِقُّ اللَّهُ الْحَقَّ بِكَلِمَاتِهِ وَلَوْ كَرِهَ الْمُجْرِمُونَ﴾",r:"سورة يونس"},
{x:"﴿وَإِنْ يَمْسَسْكَ اللَّهُ بِضُرٍّ فَلاَ كَاشِفَ لَهُ إِلاَّ هُوَ وَإِنْ يُرِدْكَ بِخَيْرٍ فَلاَ رَادَّ لِفَضْلِهِ يُصِيبُ بِهِ مَنْ يَشَاءُ مِنْ عِبَادِهِ وَهُوَ الْغَفُورُ الرَّحِيمُ﴾",r:"سورة يونس"},
{x:"﴿قَالَ هَلْ آمَنُكُمْ عَلَيْهِ إِلاَّ كَمَا أَمِنْتُكُمْ عَلَى أَخِيهِ مِنْ قَبْلُ فَاللَّهُ خَيْرٌ حَافِظًا وَهُوَ أَرْحَمُ الرَّاحِمِينَ﴾",r:"سورة يوسف"},
{x:"﴿أَتَى أَمْرُ اللَّهِ فَلاَ تَسْتَعْجِلُوهُ سُبْحَانَهُ وَتَعَالَى عَمَّا يُشْرِكُونَ ۝ يُنَزِّلُ الْمَلاَئِكَةَ بِالرُّوحِ مِنْ أَمْرِهِ عَلَى مَنْ يَشَاءُ مِنْ عِبَادِهِ أَنْ أَنْذِرُوا أَنَّهُ لاَ إِلهَ إِلاَّ أَنَا فَاتَّقُونِ ۝ خَلَقَ السَّمَاوَاتِ وَالأَْرْضَ بِالْحَقِّ تَعَالَى عَمَّا يُشْرِكُونَ﴾",r:"سورة النحل"},
{x:"﴿وَأَوْحَى رَبُّكَ إِلَى النَّحْلِ أَنِ اتَّخِذِي مِنَ الْجِبَالِ بُيُوتًا وَمِنَ الشَّجَرِ وَمِمَّا يَعْرِشُونَ ۝ ثُمَّ كُلِي مِنْ كُلِّ الثَّمَرَاتِ فَاسْلُكِي سُبُلَ رَبِّكِ ذُلُلاً يَخْرُجُ مِنْ بُطُونِهَا شَرَابٌ مُخْتَلِفٌ أَلْوَانُهُ فِيهِ شِفَاءٌ لِلنَّاسِ إِنَّ فِي ذَلِكَ لآَيَةً لِقَوْمٍ يَتَفَكَّرُونَ﴾",r:"سورة النحل"},
{x:"﴿وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِلْمُؤْمِنِينَ وَلاَ يَزِيدُ الظَّالِمِينَ إِلاَّ خَسَارًا﴾",r:"سورة الإسراء"},
{x:"﴿قُلْ ادْعُوا اللَّهَ أَوْ ادْعُوا الرَّحْمَانَ أَيًّا مَا تَدْعُوا فَلَهُ الأَْسْمَاءُ الْحُسْنَى وَلاَ تَجْهَرْ بِصَلاَتِكَ وَلاَ تُخَافِتْ بِهَا وَابْتَغِ بَيْنَ ذَلِكَ سَبِيلاً ۝ وَقُلِ الْحَمْدُ لِلَّهِ الَّذِي لَمْ يَتَّخِذْ وَلَدًا وَلَمْ يَكُنْ لَهُ شَرِيكٌ فِي الْمُلْكِ وَلَمْ يَكُنْ لَهُ وَلِيٌّ مِنَ الذُّلِّ وَكَبِّرْهُ تَكْبِيرًا﴾",r:"سورة الإسراء"},
{x:"﴿وَلَوْلاَ إِذْ دَخَلْتَ جَنَّتَكَ قُلْتَ مَا شَاءَ اللَّهُ لاَ قُوَّةَ إِلاَّ بِاللَّهِ إِنْ تَرَنِ أَنَا أَقَلَّ مِنْكَ مَالاً وَوَلَدًا﴾",r:"سورة الكهف"},
{x:"﴿قَالُوا يَامُوسَى إِمَّا أَنْ تُلْقِيَ وَإِمَّا أَنْ نَكُونَ أَوَّلَ مَنْ أَلْقَى ۝ قَالَ بَلْ أَلْقُوا فَإِذَا حِبَالُهُمْ وَعِصِيُّهُمْ يُخَيَّلُ إِلَيْهِ مِنْ سِحْرِهِمْ أَنَّهَا تَسْعَى ۝ فَأَوْجَسَ فِي نَفْسِهِ خِيفَةً مُوسَى ۝ قُلْنَا لاَ تَخَفْ إِنَّكَ أَنْتَ الأَْعْلَى ۝ وَأَلْقِ مَا فِي يَمِينِكَ تَلْقَفْ مَا صَنَعُوا إِنَّمَا صَنَعُوا كَيْدُ سَاحِرٍ وَلاَ يُفْلِحُ السَّاحِرُ حَيْثُ أَتَى﴾",r:"سورة طه"},
{x:"﴿أَفَحَسِبْتُمْ أَنَّمَا خَلَقْنَاكُمْ عَبَثًا وَأَنَّكُمْ إِلَيْنَا لاَ تُرْجَعُونَ ۝ فَتَعَالَى اللَّهُ الْمَلِكُ الْحَقُّ لاَ إِلهَ إِلاَّ هُوَ رَبُّ الْعَرْشِ الْكَرِيمِ ۝ وَمَنْ يَدْعُ مَعَ اللَّهِ إِلهًا آخَرَ لاَ بُرْهَانَ لَهُ بِهِ فَإِنَّمَا حِسَابُهُ عِنْدَ رَبِّهِ إِنَّهُ لاَ يُفْلِحُ الْكَافِرُونَ ۝ وَقُلْ رَبِّ اغْفِرْ وَارْحَمْ وَأَنْتَ خَيْرُ الرَّاحِمِينَ﴾",r:"سورة المؤمنون"},
{x:"﴿قَالَ لَهُمْ مُوسَى أَلْقُوا مَا أَنْتُمْ مُلْقُونَ ۝ فَأَلْقَوْا حِبَالَهُمْ وَعِصِيَّهُمْ وَقَالُوا بِعِزَّةِ فِرْعَوْنَ إِنَّا لَنَحْنُ الْغَالِبُونَ ۝ فَأَلْقَى مُوسَى عَصَاهُ فَإِذَا هِيَ تَلْقَفُ مَا يَأْفِكُونَ ۝ فَأُلْقِيَ السَّحَرَةُ سَاجِدِينَ ۝ قَالُوا آمَنَّا بِرَبِّ الْعَالَمِينَ ۝ رَبِّ مُوسَى وَهَارُونَ﴾",r:"سورة الشعراء"},
{x:"﴿وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ﴾",r:"سورة الشعراء"},
{x:"﴿أَمَّنْ يُجِيبُ الْمُضْطَرَّ إِذَا دَعَاهُ وَيَكْشِفُ السُّوءَ وَيَجْعَلُكُمْ خُلَفَاءَ الأَْرْضِ أَإِلهٌ مَعَ اللَّهِ قَلِيلاً مَا تَذَكَّرُونَ﴾",r:"سورة النمل"},
{x:"﴿مَا يَفْتَحِ اللَّهُ لِلنَّاسِ مِنْ رَحْمَةٍ فَلاَ مُمْسِكَ لَهَا وَمَا يُمْسِكْ فَلاَ مُرْسِلَ لَهُ مِنْ بَعْدِهِ وَهُوَ الْعَزِيزُ الْحَكِيمُ﴾",r:"سورة فاطر"},
{x:"﴿يس ۝ وَالْقُرْآنِ الْحَكِيمِ ۝ إِنَّكَ لَمِنَ الْمُرْسَلِينَ ۝ عَلَى صِرَاطٍ مُسْتَقِيمٍ ۝ تَنْزِيلَ الْعَزِيزِ الرَّحِيمِ ۝ لِتُنْذِرَ قَوْمًا مَا أُنْذِرَ آبَاؤُهُمْ فَهُمْ غَافِلُونَ ۝ لَقَدْ حَقَّ الْقَوْلُ عَلَى أَكْثَرِهِمْ فَهُمْ لاَ يُؤْمِنُونَ ۝ إِنَّا جَعَلْنَا فِي أَعْنَاقِهِمْ أَغْلاَلاً فَهِيَ إِلَى الأَْذْقَانِ فَهُمْ مُقْمَحُونَ ۝ وَجَعَلْنَا مِنْ بَيْنِ أَيْدِيهِمْ سَدًّا وَمِنْ خَلْفِهِمْ سَدًّا فَأَغْشَيْنَاهُمْ فَهُمْ لاَ يُبْصِرُونَ﴾",r:"سورة يس"},
{x:"﴿وَالصَّآفَّاتِ صَفًّا ۝ فَالزَّاجِرَاتِ زَجْرًا ۝ فَالتَّالِيَاتِ ذِكْرًا ۝ إِنَّ إِلهَكُمْ لَوَاحِدٌ ۝ رَبُّ السَّمَاوَاتِ وَالأَْرْضِ وَمَا بَيْنَهُمَا وَرَبُّ الْمَشَارِقِ ۝ إِنَّا زَيَّنَّا السَّمَاءَ الدُّنْيَا بِزِينَةٍ الْكَوَاكِبِ ۝ وَحِفْظًا مِنْ كُلِّ شَيْطَانٍ مَارِدٍ ۝ لاَ يَسَّمَّعُونَ إِلَى الْمَلإَِ الأَْعْلَى وَيُقْذَفُونَ مِنْ كُلِّ جَانِبٍ ۝ دُحُورًا وَلَهُمْ عَذَابٌ وَاصِبٌ ۝ إِلاَّ مَنْ خَطِفَ الْخَطْفَةَ فَأَتْبَعَهُ شِهَابٌ ثَاقِبٌ﴾",r:"سورة الصافات"},
{x:"﴿أَلَيْسَ اللَّهُ بِكَافٍ عَبْدَهُ وَيُخَوِّفُونَكَ بِالَّذِينَ مِنْ دُونِهِ وَمَنْ يُضْلِلِ اللَّهُ فَمَا لَهُ مِنْ هَادٍ﴾",r:"سورة الزمر"},
{x:"﴿وَيُنَجِّي اللَّهُ الَّذِينَ اتَّقَوْا بِمَفَازَتِهِمْ لاَ يَمَسُّهُمُ السُّوءُ وَلاَ هُمْ يَحْزَنُونَ﴾",r:"سورة الزمر"},
{x:"﴿وَلَوْ جَعَلْنَاهُ قُرْآنًا أَعْجَمِيًّا لَقَالُوا لَوْلاَ فُصِّلَتْ آيَاتُهُ أَأَعْجَمِيٌّ وَعَرَبِيٌّ قُلْ هُوَ لِلَّذِينَ آمَنُوا هُدىً وَشِفَاءٌ﴾",r:"سورة فصلت"},
{x:"﴿لَوْ أَنْزَلْنَا هَذَا الْقُرْآنَ عَلَى جَبَلٍ لَرَأَيْتَهُ خَاشِعًا مُتَصَدِّعًا مِنْ خَشْيَةِ اللَّهِ وَتِلْكَ الأَْمْثَالُ نَضْرِبُهَا لِلنَّاسِ لَعَلَّهُمْ يَتَفَكَّرُونَ ۝ هُوَ اللَّهُ الَّذِي لاَ إِلهَ إِلاَّ هُوَ عَالِمُ الْغَيْبِ وَالشَّهَادَةِ هُوَ الرَّحْمَانُ الرَّحِيمُ ۝ هُوَ اللَّهُ الَّذِي لاَ إِلهَ إِلاَّ هُوَ الْمَلِكُ الْقُدُّوسُ السَّلاَمُ الْمُؤْمِنُ الْمُهَيْمِنُ الْعَزِيزُ الْجَبَّارُ الْمُتَكَبِّرُ سُبْحَانَ اللَّهِ عَمَّا يُشْرِكُونَ ۝ هُوَ اللَّهُ الْخَالِقُ الْبَارِىءُ الْمُصَوِّرُ لَهُ الأَْسْمَاءُ الْحُسْنَى يُسَبِّحُ لَهُ مَا فِي السَّمَاوَاتِ وَالأَْرْضِ وَهُوَ الْعَزِيزُ الْحَكِيمُ﴾",r:"سورة الحشر"},
{x:"﴿أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ ۝ وَوَضَعْنَا عَنْكَ وِزْرَكَ ۝ الَّذِي أَنْقَضَ ظَهْرَكَ ۝ وَرَفَعْنَا لَكَ ذِكْرَكَ ۝ فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ۝ إِنَّ مَعَ الْعُسْرِ يُسْرًا ۝ فَإِذَا فَرَغْتَ فَانْصَبْ ۝ وَإِلَى رَبِّكَ فَارْغَبْ﴾",r:"سورة الشرح"},
{x:"﴿قُلْ يَاأَيُّهَا الْكَافِرُونَ ۝ لاَ أَعْبُدُ مَا تَعْبُدُونَ ۝ وَلاَ أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ ۝ وَلاَ أَنَا عَابِدٌ مَا عَبَدْتُّمْ ۝ وَلاَ أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ ۝ لَكُمْ دِينُكُمْ وَلِيَ دِينِ﴾",r:"سورة الكافرون"},
{x:"﴿قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ﴾",r:"سورة الإخلاص"},
{x:"﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ﴾",r:"سورة الفلق"},
{x:"﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ﴾",r:"سورة الناس"}]},
{t:"الاستهلال من السنة",i:[
{x:"«لاَ إِلهَ إِلاَّ اللهُ الْعَظِيمُ الْحَلِيمُ، لاَ إِلهَ إِلاَّ اللهُ رَبُّ الْعَرْشِ الْعَظِيمِ، لاَ إِلهَ إِلاَّ اللهُ رَبُّ السَّموَاتِ وَرَبُّ الأَْرْضِ، وَرَبُّ الْعَرْشِ الْكَرِيمِ»"},
{x:"«لاَ إِلهَ إِلاَّ اللهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، اللَّهُمَّ لاَ مَانِعَ لِمَا أَعْطَيْتَ وَلاَ مُعْطِيَ لِمَا مَنَعْتَ، وَلاَ يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ»"},
{x:"«لاَ إِلهَ إِلاَّ اللهُ وَحْدَهُ لاَ شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللهِ، لاَ إِلهَ إِلاَّ اللهُ، وَلاَ نَعْبُدُ إِلاَّ إِيَّاهُ، لَهُ النِّعْمَةُ وَلَهُ الْفَضْلُ، وَلَهُ الثَّنَاءُ الْحَسَنُ، لاَ إِلهَ إِلاَّ اللهُ مُخْلِصِينَ لَهُ الدِّينَ وَلَوْ كَرِهَ الْكَافِرُونَ»"}]},
{t:"الرقية من السنة",i:[
{x:"«أَعُوذُ بِاللهِ السَّمِيعِ الْعَلِيمِ مِنَ الشَّيْطَانِ الرَّجِيمِ، مِنْ هَمْزِهِ وَنَفْخِهِ وَنَفْثِهِ»"},
{x:"«أَعُوذُ بِوَجْهِ اللهِ الْكَرِيمِ، وَبِكَلِمَاتِ اللهِ التَّامَّاتِ، اللاَّتِي لاَ يُجَاوِزُهُنَّ بَرٌّ وَلاَ فَاجِرٌ، مِنْ شَرِّ مَا يَنْزِلُ مِنَ السَّمَاءِ وَشَرِّ مَا يَعْرُجُ فِيهَا، وَشَرِّ مَا ذَرَأَ فِي الأَْرْضِ وَشَرِّ مَا يَخْرُجُ مِنْهَا، وَمِنْ فِتَنِ اللَّيْلِ وَالنَّهَارِ، وَمِنْ طَوَارِقِ اللَّيْلِ وَالنَّهَارِ، إِلاَّ طَارِقًا يَطْرُقُ بِخَيْرٍ يَا رَحْمنُ»"},
{x:"«أُعِيذُكَ بِكَلِمَاتِ اللهِ التَّامَّةِ، مِنْ كُلِّ شَيْطَانٍ وَهَامَّةٍ، وَمِنْ كُلِّ عَيْنٍ لاَمَّةٍ»"},
{x:"«بِسْمِ اللهِ (ثلاثًا)، أَعُوذُ بِاللهِ (١) وَقُدْرَتِهِ مِنْ شَرِّ مَا أَجِدُ وَأُحَاذِرُ» (سبع مرات)",c:7,n:"(١) المثبت هو رواية مسلم؛ كتاب: السلام، باب: استحباب وضع يده على موضع الألم مع الدعاء، برقم (٢٢٠٢)، عن عثمان بن أبي العاص الثقفي ﵁. وعند الترمذي بلفظ: «أَعُوذُ بِعِزَّةِ اللهِ وَقُدْرَتِهِ ...» الحديث، برقم (٣٥٨٨)، عن أنس ﵁."},
{x:"«بِسْمِ اللهِ أَرْقِيكَ، مِنْ كُلِّ شَيْءٍ يُؤْذِيكَ، مِنْ شَرِّ كُلِّ نَفْسٍ أَوْ عَيْنِ حَاسِدٍ، اللهُ يَشْفِيكَ، بِسْمِ اللهِ أَرْقِيكَ»"},
{x:"«بِسْمِ اللهِ، تُرْبَةُ أَرْضِنَا بِرِيقَةِ بَعْضِنَا يُشْفى سَقِيمُنَا بِإِذْنِ رَبِّنَا» (١)",n:"(١) إن كان بالمريض قَرْحة أو جرح، وضع الراقي من ريق نفسه على إصبعه السبّابة، ثم وضعها على تراب، بحيث يَعلَق به شيء منه، ثم يمسح به الموضع العليل المتقرح أو الجريح، ثم يدعو بهذا الدعاء، ويراعى في ذلك أن لا يكون المرقيُّ امرأة أجنبية."},
{x:"«اللهُمَّ، أَذْهِبِ الْبَاسَ، رَبَّ النَّاسِ، اشْفِ وَأَنْتَ الشَّافِي، لاَ شِفَاءَ إِلاَّ شِفَاؤُكَ، شِفَاءً لاَ يُغَادِرُ سَقَماً»"},
{x:"«اللهُمَّ اشْفِ عَبْدَك يَنْكَأْ لَكَ عُدُوًا، أَوْ يَمْشِي لَكَ إِلَى صَلاَةٍ»"},
{x:"«اللهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ فِي الدُّنْيَا وَالآخِرَةِ، اللهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ، وَأَهْلِي وَمَالِي، اللهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي، اللهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي، وَعَنْ يَمِينِي وَعَنْ شِمَالِي، وَمِنْ فَوقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي»"},
{x:"«اللهُمَّ اهْدِنِي، وَارْزُقْنِي، وَعَافِنِي، وَارْحَمْنِي»"},
{x:"«اللهُمَّ بَارِكْ عَلَيْهِ، وَأَذْهِبْ عَنْهُ حَرَّ الْعَيْنِ وَبَرْدَهَا وَوَصَبَهَا» (١)",n:"(١) إن وجد الراقي في وجه المريض سفعةً (اصفرارًا، أو اسودادًا، أو تغيّر لون) من عينٍ ألمّت به، دعا بهذا الدعاء. والوَصَب: دوام الوجع ولزومُه، وقد يُطلق على التعب والفتور في البدن، انظر: النهاية لابن الأثير (٥/١٦٦)."},
{x:"«اللهُمَّ إِنِّي أَعُوذُ بِوَجْهِكَ الْكَرِيمِ وَكَلِمَاتِكَ التَّامَّةِ، مِنْ شَرِّ مَا أَنْتَ آخِذٌ بِنَاصِيَتِهِ، اللهُمَّ أَنْتَ تَكْشِفُ الْمَأْثَمَ وَالْمَغْرَمَ، اللهُمَّ لاَ يُهْزَمُ جُنْدُكَ، وَلاَ يُخْلَفُ وَعْدُكَ، وَلاَ يَنْفَعُ ذَا الْجَدِّ مِنْكَ الْجَدُّ، سُبْحَانَكَ وَبِحَمْدِكَ»"},
{x:"«رَبُّنَا اللهُ الَّذِي فِي السَّمَاءِ تَقَدَّسَ اسْمُكَ، أَمْرُكَ فِي السَّمَاءِ وَالأَْرْضِ، كَمَا رَحْمَتُكَ فِي السَّمَاءِ فَاجْعَلْ رَحْمَتَكَ فِي الأَْرْضِ، اغْفِرْ لَنَا حُوبَنَا وَخَطَايَانَا، أَنْتَ رَبُّ الطَّيِّبِينَ، أَنْزِلْ رَحْمَةً مِنْ رَحْمَتِكَ، وَشِفَاءً مِنْ شِفَائِكَ عَلَى هَذَا الْوَجَعِ فَيَبْرَأُ» (ثلاث مرات)",c:3},
{x:"«اللهُمَّ إِنِّي عَبْدُكَ، وَابْنُ عَبْدِكَ، وَابْنُ أَمَتِكَ، نَاصِيَتِي بِيَدِكَ، مَاضٍ فِيَّ حُكمُكَ، عَدْلٌ فِيَّ قَضَاؤُكَ، أَسْأَلُكَ بِكُلِّ اسْمٍ هُوَ لَكَ؛ سَمَّيْتَ بِهِ نَفْسَكَ، أَوْ أَنْزَلْتَهُ فِي كِتَابِكَ، أَوْ عَلَّمْتَهُ أَحَدًا مِنْ خَلْقِكَ، أَوِ اسْتَأْثَرْتَ بِهِ فِي عِلْمِ الْغَيْبِ عِنْدَكَ: أَنْ تَجْعَلَ الْقُرْآنَ رَبِيعَ قَلْبِي، وَنُورَ صَدْرِي، وَجَلاَءَ حُزْنِي، وَذَهابَ هَمِّي»"},
{x:"«اللهُمَّ إِنَّا نَسْأَلُكَ مِنْ خَيْرِ مَا سَأَلَكَ مِنْهُ نَبِيُّكَ مُحَمَّدٌ ﷺ، وَنَعُوذُ بِكَ مِنْ شَرِّ مَا اسْتَعَاذَ مِنْهُ نَبِيُّكَ مُحَمَّدٌ ﷺ، وَأَنْتَ الْمُسْتَعَانُ وَعَلَيْكَ الْبَلاَغُ، وَلاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللهِ»"},
{x:"«اللهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، اللهُمَّ بَارِكْ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا بَارَكْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ فِي الْعَالَمِينَ إِنَّكَ حَمِيدٌ مَجِيدٌ»"}]}
];
const $=s=>document.querySelector(s),FF=["'Amiri Quran','Amiri',serif","'Scheherazade New','Amiri',serif","'Amiri','Noto Naskh Arabic',serif","'Noto Naskh Arabic','Droid Arabic Naskh',serif","'Noto Sans Arabic','Droid Arabic Kufi',system-ui,sans-serif"],FN=["قرآني","مصحف","نسخ أميري","نسخ نوتو","سَنْس"],TH=[["light","فاتح"],["sepia","ورقي"],["dark","داكن"]];
let st={th:"light",ff:0,fs:24,sec:0},cnt={};
try{Object.assign(st,JSON.parse(localStorage.getItem("rq")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("rq",JSON.stringify(st))}catch(e){}};
function apply(){const r=document.documentElement;r.dataset.th=st.th;r.style.setProperty("--ff",FF[st.ff]);r.style.setProperty("--fs",st.fs+"px");$('meta[name=theme-color]').content=st.th=="dark"?"#101614":"#1e6b52"}
function tabs(){$("#tabs").innerHTML=D.map((s,i)=>`<button class="tab${i==st.sec?" on":""}" data-s="${i}">${s.t}</button>`).join("")}
function lbl(id,c){const n=cnt[id]||0;return c?n+" / "+c:n}
function list(){$("#list").innerHTML=D[st.sec].i.map((it,k)=>{const id=st.sec+"_"+k,n=cnt[id]||0;return `<article class="card${it.c&&n>=it.c?" done":""}" id="c${id}"><p class="tx">${it.x}</p>${it.r?`<div class="rf">${it.r}</div>`:""}${it.n?`<details><summary>حاشية</summary><p>${it.n}</p></details>`:""}<div class="row"><button class="cb" data-id="${id}">${lbl(id,it.c)}</button><button class="rs" data-r="${id}" ${n?"":"hidden"}>إعادة</button></div></article>`}).join("");scrollTo(0,0)}
function upd(id){const [s,k]=id.split("_"),it=D[s].i[k],n=cnt[id]||0,c=$("#c"+id);c.querySelector(".cb").textContent=lbl(id,it.c);c.querySelector(".rs").hidden=!n;c.classList.toggle("done",!!it.c&&n>=it.c)}
function opts(el,arr,key){$(el).innerHTML=arr.map((a,i)=>`<button data-k="${key}" data-v="${a[0]??i}" class="${st[key]==(a[0]??i)?"on":""}">${a[1]??a}</button>`).join("")}
function sheet(){opts("#o-th",TH,"th");opts("#o-ff",FN,"ff");$("#fs").value=st.fs}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
if(d.s!=null){st.sec=+d.s;save();tabs();list()}
else if(d.id){const[s,k]=d.id.split("_"),c=D[s].i[k].c,n=cnt[d.id]||0;if(c&&n>=c)return;cnt[d.id]=n+1;if(c&&n+1>=c)navigator.vibrate&&navigator.vibrate(60);upd(d.id)}
else if(d.r){delete cnt[d.r];upd(d.r)}
else if(d.k){st[d.k]=d.k=="th"?d.v:+d.v;save();apply();sheet()}
else if(b.id=="gear"){sheet();$("#sh").hidden=false}
else if(b.id=="rall"){cnt={};list()}});
$("#sh").addEventListener("click",e=>{if(e.target.id=="sh")e.target.hidden=true});
$("#fs").addEventListener("input",e=>{st.fs=+e.target.value;save();apply()});
apply();tabs();list();
</script></body></html>
